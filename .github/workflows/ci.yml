name: ci

on:
  push:
  pull_request:

jobs:
  lint-test-train:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -c "import sys; print('Python paths:'); print('\n'.join(sys.path))"
          python -c "import heart_disease_mlops; print('Package installed:', heart_disease_mlops.__version__)"
          python -c "import heart_disease_mlops, importlib; print('Imported from:', heart_disease_mlops.__file__); m=importlib.import_module('heart_disease_mlops.data'); print('Subpackage ok:', m.__file__)"

      - name: Lint
        run: |
          python -m ruff check .

      - name: Unit tests
        run: |
          python -m pytest

      - name: Train (quick)
        run: |
          python -m heart_disease_mlops.pipeline run --quick

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            artifacts/eda
            artifacts/model
            artifacts/mlruns
